name: pr

# Isolated contribution check: untrusted fork code builds and tests here with
# no organization secrets and no self-hosted runner. Runs only on
# pull_request (never pull_request_target), on GitHub-hosted runners, with a
# read-only token. Release stays on release.yml (tags + manual dispatch).
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: title_storage
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TITLE_STORAGE_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/title_storage?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: test -z "$(gofmt -l .)"
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go test -count=1 ./...
